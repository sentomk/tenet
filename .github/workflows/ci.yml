name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / header-only=${{ matrix.header_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        header_only: [ON, OFF]

    steps:
      - uses: actions/checkout@v4

      - name: Check include style
        shell: bash
        run: |
          # Project and third-party headers must use quoted includes;
          # only standard library headers may use angle brackets.
          offenders=$(grep -rEn --include='*.hpp' --include='*.cpp' \
            '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(tenet|gtest)/' \
            include src tests || true)
          if [ -n "$offenders" ]; then
            echo "Angle-bracket includes found for project/third-party headers:"
            echo "$offenders"
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTENET_HEADER_ONLY=${{ matrix.header_only }}

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
